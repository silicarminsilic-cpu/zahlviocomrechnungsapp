/* Layout: grüner Hero-Block mit Dashboard-Karte; App mit weisser Sidebar (250px) auf #F3F8F5 */
:root{
  --fg:var(--ink);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --bg:#F3F8F5;--surface:#FFFFFF;--surface2:#EDF4F0;--ink:#172B26;--muted:#60736B;--line:#DDE9E3;
  --accent:#087F5B;--accent-hover:#066B4D;--accent2:#12B886;--accent-ink:#FFFFFF;--accent-soft:#E8F5EE;--accent-text:#067150;
  --hero:#087F5B;--on-green:#EEFAF3;--brand-text:#E6F5EC;
  --ok-soft:#E8F5EE;--ok-text:#087F5B;
  --open-soft:#EAEFEC;--open-text:#3F544C;
  --warn:#F59E0B;--warn-soft:#FEF3C7;--warn-text:#92400E;
  --bad:#DC2626;--bad-soft:#FEE2E2;--bad-text:#991B1B;
  --paper:#FFFFFF;--paper-ink:#172B26;--paper-muted:#60736B;--paper-line:#DDE9E3;
  --shadow:0 1px 2px rgba(23,43,38,.05),0 6px 20px rgba(23,43,38,.06);
  --shadow-lg:0 2px 4px rgba(23,43,38,.05),0 24px 56px rgba(23,43,38,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1714;--surface:#13211C;--surface2:#182A24;--ink:#E4F0EA;--muted:#8FA89E;--line:#243A32;
  --accent:#12B886;--accent-hover:#3BCB9E;--accent-ink:#06261D;--accent-soft:#143A2E;--accent-text:#5FDDB2;
  --ok-soft:#143A2E;--ok-text:#5FDDB2;--open-soft:#1D2D27;--open-text:#A9C0B6;
  --warn-soft:#3A2A0A;--warn-text:#FBBF24;--bad:#F87171;--bad-soft:#3B1517;--bad-text:#FCA5A5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--shadow-lg:0 24px 56px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1714;--surface:#13211C;--surface2:#182A24;--ink:#E4F0EA;--muted:#8FA89E;--line:#243A32;
  --accent:#12B886;--accent-hover:#3BCB9E;--accent-ink:#06261D;--accent-soft:#143A2E;--accent-text:#5FDDB2;
  --ok-soft:#143A2E;--ok-text:#5FDDB2;--open-soft:#1D2D27;--open-text:#A9C0B6;
  --warn-soft:#3A2A0A;--warn-text:#FBBF24;--bad:#F87171;--bad-soft:#3B1517;--bad-text:#FCA5A5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);--shadow-lg:0 24px 56px rgba(0,0,0,.5);color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-weight:400;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
h1,h2{font-weight:700}h3,h4{font-weight:600}
p{margin:0}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:6px}
.num,.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 4px 14px rgba(8,127,91,.25)}
.btn.light{background:#fff;border-color:#fff;color:#087F5B}
.btn.light:hover{background:#F3F8F5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.outw{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}
.btn.outw:hover{background:rgba(255,255,255,.12)}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:12px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad-text)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Marke */
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:21px;letter-spacing:-.03em;text-decoration:none;color:var(--accent-text)}
.brand svg.lg{width:28px;height:28px;color:var(--accent)}
.brand.w{color:#fff}.brand.w svg.lg{color:#fff}

/* Landing */
.wrap{max-width:1180px;margin-inline:auto}
.demo-strip{background:var(--warn-soft);color:var(--warn-text);border-radius:10px;padding:8px 14px;font-size:13px;margin-block:12px 0}
.heroband{background:var(--hero);color:#fff;border-radius:28px;padding:18px 36px 60px;margin-top:12px}
.l-nav{display:flex;align-items:center;gap:20px;padding-block:6px 30px}
.l-nav nav{display:flex;gap:26px;margin-left:36px;font-size:14px;font-weight:500}
.l-nav nav a{text-decoration:none;color:var(--brand-text)}.l-nav nav a:hover{color:#fff}
.l-nav .sp{flex:1}
.l-nav .themebtn{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding-top:16px}
.hero h1{font-size:clamp(34px,5vw,58px);color:#fff;letter-spacing:-.035em}
.hero .sub{margin-top:18px;font-size:18px;color:var(--on-green);max-width:50ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .fine{margin-top:18px;font-size:13.5px;color:var(--brand-text);display:flex;flex-wrap:wrap;gap:6px 20px}
.hero .fine span{display:inline-flex;gap:6px;align-items:center}
.hero .fine svg{width:15px;height:15px;color:#7BE0B7}
.herocard{min-width:0}
.herocard .cap{font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff}
.herocard .cap2{color:var(--on-green);margin:6px 0 18px;max-width:42ch}
.dp{background:#fff;color:#172B26;border-radius:16px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:fin .4s ease-out both}
.dp h4{font-size:17px;margin-bottom:14px}
.dp .k2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dp .kk{background:#F3F8F5;border-radius:10px;padding:14px;min-width:0}
.dp .kk small{display:block;color:#60736B;font-size:13px}
.dp .kk b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.dp .kk b.g{color:#087F5B}
.dp .rows{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.dp .rw{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;border:1px solid #DDE9E3;border-radius:10px}
.dp .rw small{color:#60736B}
.dp .btn.primary{width:100%;margin-top:14px;background:#087F5B;border-color:#087F5B;color:#fff}
.dp .btn.primary:hover{background:#066B4D}
.band{padding-block:60px 8px}
.band h2{font-size:clamp(26px,3.4vw,38px);max-width:24ch}
.band .lead{color:var(--muted);margin-top:12px;max-width:62ch;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.tile{background:var(--surface);border-radius:16px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.tile h3{font-size:17px;margin-top:14px}
.tile p{color:var(--muted);margin-top:6px;font-size:14.5px}
.tile ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.ico{width:40px;height:40px;border-radius:11px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{padding:8px 14px;border-radius:99px;background:var(--surface);font-size:14px;box-shadow:var(--shadow)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.plan{background:var(--surface);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.plan.hot{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.plan .price{font-size:34px;font-weight:700;letter-spacing:-.03em}
.plan .price small{font-size:14px;font-weight:400;color:var(--muted)}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px;flex:1}
.plan li{display:flex;gap:8px;align-items:flex-start}.plan li svg{color:var(--accent);width:16px;height:16px;margin-top:3px}
details.faq{border-bottom:1px solid var(--line);padding:16px 0}
details.faq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:'+';color:var(--muted);font-size:20px;line-height:1}
details.faq[open] summary::after{content:'–'}
details.faq p{color:var(--muted);margin-top:8px;max-width:70ch}
.final{background:var(--hero);color:#fff;border-radius:28px;padding:52px 32px;text-align:center;margin-block:56px 40px}
.final h2{color:#fff;margin-inline:auto}.final p{color:var(--on-green);margin:12px auto 24px;max-width:50ch}
.l-foot{padding-block:24px 32px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;border-top:1px solid var(--line)}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.auth .card{width:100%;max-width:420px}
.auth .card.wide{max-width:680px}

/* App */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;padding-block:16px;align-items:start;max-width:1440px;margin-inline:auto}
.side{position:sticky;top:16px;background:var(--surface);color:var(--muted);border-radius:16px;padding:18px 12px 14px;display:flex;flex-direction:column;gap:3px;height:calc(100vh - 32px);max-height:820px;box-shadow:var(--shadow);overflow:auto}
.side .brand{padding:2px 10px 16px}
.nav-i{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;color:inherit;font-size:14px;font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s}
.nav-i:hover{background:var(--bg);color:var(--ink)}
.nav-i.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav-i .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.side .sp{flex:1;min-height:12px}
.side .sep{border-top:1px solid var(--line);margin:8px 4px 6px}
.side .org{padding:8px 10px 0;font-size:12px}
.side .org b{display:block;color:var(--ink);font-size:13px}
.main{min-width:0;padding-bottom:20px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:26px}
.top .sp{flex:1}
.top .sub{width:100%;color:var(--muted);margin-top:-6px}
.pill-demo{font-size:11.5px;font-weight:600;color:var(--warn-text);background:var(--warn-soft);padding:4px 10px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase}
.themebtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border-radius:16px;padding:18px;position:relative;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}.kpi:nth-child(4){animation-delay:.12s}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.ok b{color:var(--accent-text)}.kpi.bad b{color:var(--bad-text)}
.kpi .tag{position:absolute;right:16px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--accent2)}
.kpi.bad .tag{background:var(--bad)}.kpi.warn .tag{background:var(--warn)}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:14px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.panel{background:var(--surface);border-radius:16px;padding:20px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.qa button{display:flex;align-items:center;gap:12px;padding:14px;border:0;background:var(--surface);border-radius:14px;font-weight:600;text-align:left;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.qa button:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.qa .ico{width:34px;height:34px;flex:none}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .g{flex:1;min-width:0}
.li .g b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .g small{color:var(--muted);font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.st-open{background:var(--open-soft);color:var(--open-text)}
.st-paid{background:var(--ok-soft);color:var(--ok-text)}
.st-partial{background:var(--warn-soft);color:var(--warn-text)}
.st-overdue{background:var(--bad-soft);color:var(--bad-text)}
.st-draft{background:var(--surface2);color:var(--muted)}
.st-cancel{background:var(--surface2);color:var(--muted);text-decoration:line-through}
.nudge{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-text);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.nudge button{margin-left:auto}
.notice{display:flex;gap:10px;background:var(--warn-soft);color:var(--warn-text);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-block:10px}
.notice.bad{background:var(--bad-soft);color:var(--bad-text)}
.notice.ok{background:var(--ok-soft);color:var(--ok-text)}
.notice.info{background:var(--accent-soft);color:var(--accent-text)}
.notice svg{margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools .grow{flex:1;min-width:180px}
.tabs{display:flex;gap:2px;background:var(--surface);border-radius:12px;padding:4px;flex-wrap:wrap;box-shadow:var(--shadow);margin-bottom:12px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);display:flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.tabs button i{font-style:normal;font-size:11.5px;opacity:.75}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.in,select.in,textarea.in{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;min-width:0}
.in:focus{outline:2px solid var(--accent2);outline-offset:-1px;border-color:transparent}
.in[disabled]{background:var(--surface2);color:var(--muted)}
textarea.in{resize:vertical;min-height:80px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.searchbox .in{padding-left:34px}
.tblwrap{overflow-x:auto;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
table.t{width:100%;border-collapse:collapse;min-width:760px}
.t th{font-size:12.5px;color:var(--muted);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500}
.t th.sortable{cursor:pointer}
.t td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:var(--bg)}
.t .r{text-align:right}
.t tfoot td{font-weight:700;background:var(--bg)}
.rowact{display:flex;gap:2px;justify-content:flex-end;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.ed .form{display:flex;flex-direction:column;gap:14px}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.item{border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.item .frow{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.item-h{display:flex;gap:8px;align-items:center}
.item-h .in{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.totals{margin-left:auto;max-width:320px;width:100%;display:flex;flex-direction:column;gap:4px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .big{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.prevwrap{position:sticky;top:16px;min-width:0}
.tplbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}

/* Geld: ausschliesslich Ganzzahlen (Rappen/Cent, Hundertstel, Basispunkte) */
function pd(v,sc){let s=String(v??'').trim().replace(/[\s']/g,'').replace(',','.');
  if(!/^-?\d*\.?\d*$/.test(s)||s===''||s==='-'||s==='.')return 0;
  const neg=s[0]==='-';if(neg)s=s.slice(1);
  let [a,b='']=s.split('.');b=(b+'0'.repeat(sc+1)).slice(0,sc+1);

function calc(inv){

    const q=pd(it.qty,2),p=pd(it.price,2),d=pd(it.disc,2);

function chartSVG(){
  const dc=dcur(),months=[];for(let k=6;k>=0;k--){const d=new Date(now.getFullYear(),now.getMonth()-k,1);months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:MONTHS[d.getMonth()],tot:0,paid:0})}
  S.invoices.filter(i=>i.status==='final'&&(i.cur||CUR())===dc).forEach(i=>{const m=months.find(x=>x.key===i.date.slice(0,7));if(m){const c=calc(i);m.tot+=c.total;m.paid+=Math.min(c.paid,c.total)}});
  const max=Math.max(...months.map(m=>m.tot),1);
  const steps=[100000,200000,250000,500000,1000000,2000000];const step=steps.find(s=>max/s<=4)||2000000;const top=Math.ceil(max/step)*step;
  const W=560,H=230,L=52,B=28,T=10,R=8,iw=W-L-R,ih=H-B-T,gw=iw/months.length,bw=Math.min(34,gw*.55);
  const y=v=>T+ih-(v/top)*ih;let g='';
  for(let v=0;v<=top;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${nf(0).format(v/100)}</text>`}
  months.forEach((m,i)=>{const x=L+gw*i+(gw-bw)/2;
    g+=`<rect x="${x}" y="${y(m.tot)}" width="${bw}" height="${Math.max(0,T+ih-y(m.tot))}" rx="5" style="fill:color-mix(in srgb,var(--accent2) 30%,transparent)"/>`;
    g+=`<rect x="${x}" y="${y(m.paid)}" width="${bw}" height="${Math.max(0,T+ih-y(m.paid))}" rx="5" style="fill:var(--accent)"/>`;
    g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${m.label}</text>`;
    if(m.tot>0)g+=`<title>${m.label}: ${chf(m.tot,0,dc)} fakturiert, ${chf(m.paid,0,dc)} bezahlt</title>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monatliches Rechnungsvolumen in ${dc}" style="display:block;max-width:100%">${g}</svg>`}
function nextStep(){
  const fin=S.invoices.filter(i=>i.status==='final'),od=overdueList(),dr=S.invoices.filter(i=>i.status==='draft');
  if(!S.customers.length)return {t:'Lege deinen ersten Kunden an',s:'Land und Währung des Kunden bestimmen Steuerfall und Bankverbindung der Rechnung.',b:'Kunden anlegen',act:'newcust'};
  if(!fin.length)return dr.length?{t:'Schliesse deine erste Rechnung ab',s:'Entwurf prüfen und finalisieren.',b:'Entwurf öffnen',act:'openinv',id:dr[0].id}:{t:'Erstelle deine erste Rechnung',s:'Mit wenigen Eingaben, die Vorschau aktualisiert sich live.',b:'Neue Rechnung',act:'newinv'};
  if(od.length){const i=od[0];return {t:`${od.length} überfällige ${od.length===1?'Rechnung':'Rechnungen'}`,s:`${i.no} von ${cust(i.cust).name}: ${cm(calc(i).rest,i)} seit ${diffDays(todayIso,i.due)} Tagen offen. Eine freundliche Erinnerung ist der nächste Schritt.`,b:'Mahnung erstellen',act:'remind',id:i.id}}
  if(dr.length)return {t:'Ein Entwurf wartet auf dich',s:`${dr[0].no||'Entwurf'} für ${cust(dr[0].cust).name} ist noch nicht finalisiert.`,b:'Entwurf öffnen',act:'openinv',id:dr[0].id};
  const soon=fin.filter(i=>['open','partial'].includes(stat(i))&&diffDays(i.due,todayIso)<=7).sort((a,b)=>a.due.localeCompare(b.due))[0];
  if(soon){const n=diffDays(soon.due,todayIso);return {t:`${soon.no} ist ${n<=0?'heute':'in '+n+' Tagen'} fällig`,s:`${cust(soon.cust).name}, offen ${cm(calc(soon).rest,soon)}. Ist die Zahlung eingegangen, erfasse sie hier.`,b:'Zahlung erfassen',act:'pay',id:soon.id}}
  return {t:'Alles im grünen Bereich',s:'Keine überfälligen Rechnungen. Zeit für die nächste Rechnung.',b:'Neue Rechnung',act:'newinv'}}
function checklist(){const s=S.settings;return [
 [!!(s.ibanCHF||s.ibanEUR)&&!!s.company,'Firmendaten und Bankverbindung ergänzen','Einstellungen','nav','settings'],
 [S.customers.length>0,'Ersten Kunden anlegen','Kunden anlegen','newcust',''],
 [S.invoices.some(i=>i.status==='final'),'Erste Rechnung finalisieren','Neue Rechnung','newinv',''],
 [S.invoices.some(i=>i.sent),'Rechnung per E-Mail versenden','Zu den Rechnungen','nav','invoices'],
 [S.invoices.some(i=>(i.payments||[]).length>0),'Erste Zahlung erfassen','Zahlung erfassen','pay','']]}
function dashboard(){
  const dc=dcur(),fin=S.invoices.filter(i=>i.status==='final'&&(i.cur||CUR())===dc);let billed=0,paid=0,open=0,over=0,overN=0;
  fin.forEach(i=>{const c=calc(i);billed+=c.total;paid+=Math.min(c.paid,c.total);const s=stat(i);if(s==='overdue'){over+=c.rest;overN++}else if(s==='open'||s==='partial')open+=c.rest});
  const unpaid=fin.filter(i=>['open','partial','overdue'].includes(stat(i))).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
  const recent=S.invoices.filter(i=>i.status!=='draft').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const top=S.customers.map(c=>({c,s:custStats(c)})).sort((a,b)=>b.s.vol-a.s.vol).slice(0,5);
  const grp={};S.customers.forEach(c=>{const k=(c.country||'CH')+' · '+(c.cur||CUR()),s=custStats(c);const g=grp[k]=grp[k]||{n:0,vol:0,open:0,cur:c.cur||CUR()};g.n++;g.vol+=s.vol;g.open+=s.open});
  const cl=checklist(),done=cl.filter(x=>x[0]).length,nx=nextStep();
  const k=(l,v,cl,sub)=>`<div class="kpi ${cl}"><span class="tag"></span><small>${l}</small><b data-count="${v}" data-cur="${dc}">${chf(v,0,dc)}</b>${sub?`<em>${sub}</em>`:''}</div>`;
  const ctabs=curList().length>1?`<div class="tabs" role="tablist" aria-label="Währung">${curList().map(c=>`<button class="${c===dc?'on':''}" data-act="dcur" data-id="${c}" role="tab">${c}</button>`).join('')}<span class="muted" style="font-size:12px;align-self:center;padding:0 10px">Beträge je Währung, ohne Umrechnung</span></div>`:'';
  return shell('Guten Tag, '+esc(S.user.first),`${ctabs}
   <div class="kpis">${k('Gesamt fakturiert',billed,'',fin.length+' Rechnungen')}${k('Bereits bezahlt',paid,'ok','')}${k('Offene Beträge',open,'warn','')}${k('Überfällige Rechnungen',over,'bad',overN+(overN===1?' Rechnung':' Rechnungen'))}</div>
   <div class="nextcard"><div><small>Dein nächster Schritt</small><b>${esc(nx.t)}</b><span>${esc(nx.s)}</span></div><button class="btn light" data-act="${nx.act}" data-id="${nx.id||''}">${esc(nx.b)} ${ico('arrow')}</button></div>
   <div class="qa"><button data-act="newinv"><span class="ico">${ico('plus')}</span>Neue Rechnung</button><button data-act="newcust"><span class="ico">${ico('users')}</span>Neuen Kunden anlegen</button><button data-act="remind"><span class="ico">${ico('bell')}</span>Mahnung erstellen</button><button data-act="pay"><span class="ico">${ico('wallet')}</span>Zahlung erfassen</button></div>
   ${done<cl.length?`<div class="panel" style="margin-top:14px"><h3>Erste Schritte <span class="sp"></span><span class="muted" style="font-weight:400;font-size:13px">${done} von ${cl.length}</span></h3><div class="progress"><i style="width:${done/cl.length*100}%"></i></div><div class="list">${cl.map(x=>`<div class="li"><span class="chk ${x[0]?'on':''}">${x[0]?ico('check'):''}</span><div class="g"><b style="${x[0]?'color:var(--muted);text-decoration:line-through':''}">${x[1]}</b></div>${x[0]?'':`<button class="btn sm" data-act="${x[3]}" data-id="${x[4]}">${x[2]}</button>`}</div>`).join('')}</div></div>`:''}
   ${overN>=2?`<div class="nudge">${ico('bell')}<span>Du hast ${overN} überfällige Rechnungen. Mit Pro kannst du automatische Zahlungserinnerungen aktivieren.</span><button class="btn sm" data-act="nav" data-id="reminders">Zu den Mahnungen</button></div>`:''}
   <div class="cols"><div class="panel"><h3>Monatliches Rechnungsvolumen <span class="sp"></span><span class="muted" style="font-weight:400;font-size:12px">${dc}, nach Rechnungsdatum</span></h3>${chartSVG()}
     <div style="display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:6px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--accent2) 30%,transparent);margin-right:6px"></i>Fakturiert</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:6px"></i>Davon bezahlt</span></div></div>
    <div class="panel"><h3>Offene Zahlungen</h3>${unpaid.length?`<div class="list">${unpaid.map(i=>`<div class="li"><span class="av">${esc(initials(cust(i.cust).name))}</span><div class="g"><b>${esc(i.no)} · ${esc(cust(i.cust).name)}</b><small>fällig ${fd(i.due)}</small></div><div style="text-align:right"><b class="num" style="font-weight:600">${cm(calc(i).rest,i,0)}</b><br>${badge(stat(i))}</div></div>`).join('')}</div>`:`<div class="empty"><b>Alles bezahlt</b>Keine offenen Rechnungen in ${dc}.<br><button class="btn primary sm" style="margin-top:10px" data-act="newinv">Neue Rechnung</button></div>`}</div></div>
   <div class="cols" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)"><div class="panel"><h3>Letzte Rechnungen <span class="sp"></span><button class="btn sm ghost" data-act="nav" data-id="invoices">Alle ansehen</button></h3>${recent.length?`<div class="list">${recent.map(i=>`<div class="li"><div class="g"><b>${esc(i.no)} · ${esc(cust(i.cust).name)}</b><small>${fd(i.date)}</small></div><span class="num">${cm(calc(i).total,i)}</span>${badge(stat(i))}<button class="btn sm ghost" data-act="openinv" data-id="${i.id}" aria-label="Öffnen">${ico('eye')}</button></div>`).join('')}</div>`:`<div class="empty"><b>Noch keine Rechnungen</b>Erstelle deine erste Rechnung in wenigen Klicks.<br><button class="btn primary sm" style="margin-top:10px" data-act="newinv">Rechnung erstellen</button></div>`}</div>
    <div class="panel"><h3>Kundenübersicht <span class="sp"></span><span class="muted" style="font-weight:400;font-size:13px">${S.customers.length} Kunden</span></h3>${top.length?`<div class="list">${top.map(x=>`<div class="li"><span class="av">${esc(initials(x.c.name))}</span><div class="g"><b>${esc(x.c.name)}</b><small>${esc(x.c.country||'')} · ${x.c.cur||CUR()} · ${x.s.n} Rechnungen</small></div><span class="num" style="font-weight:600">${chf(x.s.vol,0,x.c.cur||CUR())}</span></div>`).join('')}</div>`:`<div class="empty"><b>Noch keine Kunden</b><button class="btn primary sm" style="margin-top:10px" data-act="newcust">Kunden anlegen</button></div>`}</div></div>
   ${Object.keys(grp).length?`<div class="panel" style="margin-top:14px"><h3>Kunden nach Land und Währung</h3><div class="list">${Object.entries(grp).map(([key,g])=>`<div class="li"><div class="g"><b>${key}</b><small>${g.n} ${g.n===1?'Kunde':'Kunden'}</small></div><div style="text-align:right"><span class="num" style="font-weight:600">${chf(g.vol,0,g.cur)}</span><br><small class="muted">davon offen ${chf(g.open,0,g.cur)}</small></div></div>`).join('')}</div></div>`:''}`,'','Hier findest du deine Rechnungen und Finanzen auf einen Blick.')}

/* ========== Rechnungsliste ========== */
function rowAction(i,s){
  if(s==='draft')return `<button class="btn sm primary" data-act="openinv" data-id="${i.id}">Fertigstellen</button>`;
  if(s==='open'||s==='partial')return `<button class="btn sm" data-act="pay" data-id="${i.id}">Zahlung erfassen</button>`;
  if(s==='overdue')return `<button class="btn sm primary" data-act="remind" data-id="${i.id}">Mahnen</button>`;
  return ''}
function invRows(){
  const q=UI.q.trim().toLowerCase();
  let L=S.invoices.filter(i=>(UI.filter==='all'||stat(i)===UI.filter)&&(UI.fcur==='all'||(i.cur||CUR())===UI.fcur)&&(!q||(i.no+' '+cust(i.cust).name+' '+i.project+' '+i.ref).toLowerCase().includes(q)));
  const key={date:i=>i.date,no:i=>i.no||'ZZZ',amount:i=>calc(i).total,due:i=>i.due}[UI.sort];
  L.sort((a,b)=>{const x=key(a),y=key(b);return (x>y?1:x<y?-1:0)*UI.dir});
  if(!L.length)return `<div class="empty panel"><b>Keine Rechnungen gefunden</b>Passe Suche oder Filter an oder erstelle eine neue Rechnung.<br><button class="btn primary sm" style="margin-top:10px" data-act="newinv">Rechnung erstellen</button></div>`;
  const th=(k,l,cl='')=>`<th class="sortable ${cl}" data-act="sort" data-id="${k}">${l}${UI.sort===k?(UI.dir>0?' ↑':' ↓'):''}</th>`;
  return `<div class="tblwrap"><table class="t"><thead><tr>${th('no','Rechnungsnummer')}<th>Kunde</th>${th('date','Erstellt')}${th('due','Fällig')}${th('amount','Betrag','r')}<th class="r">Offen</th><th>Status</th><th></th></tr></thead><tbody>${L.map(i=>{const c=calc(i),s=stat(i),fin=i.status==='final',cu=cust(i.cust);
   return `<tr><td class="mono">${esc(i.no||'Entwurf')}</td><td>${esc(cu.name)} <span class="cc">${esc(cu.country||'')}</span><br><small class="muted">${esc(i.project)}</small></td><td class="num">${fd(i.date)}</td><td class="num">${fd(i.due)}</td><td class="r num">${cm(c.total,i)}</td><td class="r num">${fin?cm(c.rest,i):'–'}</td><td>${badge(s)}</td>
   <td><div class="rowact">${rowAction(i,s)}<button class="btn sm ghost" data-act="openinv" data-id="${i.id}" title="Öffnen" aria-label="Öffnen">${ico('eye')}</button>
   ${fin?`<button class="btn sm ghost" data-act="pdf-dl" data-id="${i.id}" title="PDF herunterladen" aria-label="PDF herunterladen">${ico('download')}</button><button class="btn sm ghost" data-act="mail" data-id="${i.id}" title="E-Mail senden" aria-label="E-Mail senden">${ico('send')}</button>`:''}
   <button class="btn sm ghost" data-act="dupinv" data-id="${i.id}" title="Duplizieren" aria-label="Duplizieren">${ico('copy')}</button>
   ${i.status==='draft'?`<button class="btn sm ghost danger" data-act="delinv" data-id="${i.id}" title="Entwurf löschen" aria-label="Entwurf löschen">${ico('trash')}</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`}
function invoicesView(){

/* ========== Kunden ========== */
function custStats(c){const L=S.invoices.filter(i=>i.cust===c.id&&i.status==='final');let vol=0,open=0;L.forEach(i=>{const k=calc(i);vol+=k.total;open+=k.rest});return {n:L.length,vol,open}}
function custPay(c){const L=S.invoices.filter(i=>i.cust===c.id&&i.status==='final'&&calc(i).rest<=0&&i.payments.length);if(!L.length)return {n:0,avg:0,late:0};
  let sum=0,late=0;L.forEach(i=>{const last=i.payments.map(p=>p.date).sort().slice(-1)[0];sum+=diffDays(last,i.date);if(last>i.due)late++});return {n:L.length,avg:Math.round(sum/L.length),late}}
const payChip=p=>!p.n?'<span class="muted">–</span>':`<span class="st ${p.late/p.n>.3?'st-partial':'st-paid'}">Ø ${p.avg} Tage</span>`;
function custRows(){
  const q=UI.cq.trim().toLowerCase();const L=S.customers.filter(c=>(UI.ccf==='all'||c.country===UI.ccf)&&(!q||(c.name+' '+c.contact+' '+c.city+' '+c.email).toLowerCase().includes(q)));
  if(!L.length)return `<div class="empty panel"><b>Keine Kunden gefunden</b>Lege einen neuen Kunden an oder ändere Suche und Filter.<br><button class="btn primary sm" style="margin-top:10px" data-act="newcust">Kunden anlegen</button></div>`;

   <td><div class="rowact"><button class="btn sm" data-act="custprofile" data-id="${c.id}">Profil</button>${c.archived?`<button class="btn sm" data-act="archcust" data-id="${c.id}">Reaktivieren</button>`:`<button class="btn sm primary" data-act="invforcust" data-id="${c.id}">Rechnung</button>`}</div></td></tr>`}).join('')}</tbody></table></div>`}

function remindersView(){

   <div class="panel"><h3>Mahnfristen</h3><p class="muted" style="font-size:13.5px;margin-bottom:10px">Tage nach Fälligkeit, ab denen die jeweilige Stufe vorgeschlagen wird.</p><div class="stack">${LV.map((n,k)=>`<div class="field"><label for="dun${k}">${n}</label><input id="dun${k}" class="in" type="number" min="0" value="${t[k]}" data-dun="${k}"></div>`).join('')}
   <div class="nudge" style="margin:0">${ico('bell')}<span><b>Automatische Erinnerungen</b> sind eine Pro-Funktion und standardmässig aus. Sie werden nur nach ausdrücklicher Aktivierung versendet.</span></div></div></div></div>`)}
function reminderText(i,lv,fee,days){
  const c=calc(i),cu=cust(i.cust),to=cu.contact||cu.name,set=S.settings,dl=fd(addIso(todayIso,days));
  const p={0:`bei der Durchsicht unserer Buchhaltung ist uns aufgefallen, dass die Rechnung ${i.no} vom ${fd(i.date)} über ${cm(c.rest,i)} noch nicht beglichen ist. Sie war am ${fd(i.due)} fällig. Sollten Sie die Zahlung bereits veranlasst haben, betrachten Sie dieses Schreiben bitte als gegenstandslos.`,
   1:`trotz unserer Zahlungserinnerung ist die Rechnung ${i.no} vom ${fd(i.date)} noch offen. Wir bitten Sie, den Betrag von ${cm(c.rest,i)} bis zum ${dl} zu überweisen.`,
   2:`leider haben wir auf unsere erste Mahnung keinen Zahlungseingang für die Rechnung ${i.no} festgestellt. Bitte überweisen Sie ${cm(c.rest,i)} bis spätestens ${dl}.`,
   3:`dies ist unsere letzte Mahnung für die Rechnung ${i.no}. Wir bitten Sie, ${cm(c.rest,i)} bis zum ${dl} zu begleichen. Bleibt die Zahlung aus, behalten wir uns weitere Schritte vor.`}[lv];
  return `Guten Tag ${to},\n\n${p}${fee>0?`\n\nMahngebühr: ${cm(fee,i)}`:''}\n\nFreundliche Grüsse\n${set.company}`}

function taxData(){
  const y=now.getFullYear(),L=S.invoices.filter(i=>i.status==='final'&&i.date.startsWith(String(y))&&(i.cur||CUR())===CUR());
  const rates=[...new Set(L.flatMap(i=>calc(i).taxes.map(t=>t.rate)))].sort((a,b)=>b-a);
  const rows=[];for(let m=0;m<=now.getMonth();m++){const li=L.filter(i=>+i.date.slice(5,7)===m+1);let net=0,total=0;const tx={};rates.forEach(r=>tx[r]=0);
    li.forEach(i=>{const c=calc(i);net+=c.net;total+=c.total;c.taxes.forEach(t=>tx[t.rate]+=t.tax)});rows.push({label:MONTHS[m],n:li.length,net,tx,total})}
  const tot={n:0,net:0,total:0,tx:{}};rates.forEach(r=>tot.tx[r]=0);rows.forEach(r=>{tot.n+=r.n;tot.net+=r.net;tot.total+=r.total;rates.forEach(k=>tot.tx[k]+=r.tx[k])});
  return {y,rates,rows,tot,other:S.invoices.filter(i=>i.status==='final'&&(i.cur||CUR())!==CUR()).length}}
function taxView(){
  const d=taxData(),t=TAX[S.settings.country];
  return shell('Steuern & Auswertungen',`
   <div class="notice">${ico('alert')}<span>Die Auswertung zeigt berechnete Werte aus deinen finalisierten Rechnungen (Rechnungsdatum ${d.y}, ${CUR()}). Sie ersetzt keine Steuerabrechnung. Lass Meldungen an die Steuerbehörde fachlich prüfen.</span></div>
   <div class="tools"><span class="muted grow">Steuerstatus: <b style="color:var(--ink)">${TAXSTAT[S.settings.tax]}</b> · Land: ${t.label}</span><button class="btn" data-act="taxcsv">${ico('copy')}CSV</button></div>
   <div class="tblwrap"><table class="t"><thead><tr><th>Monat</th><th class="r">Rechnungen</th><th class="r">Netto</th>${d.rates.map(r=>`<th class="r">${t.vat} ${bpPct(r)}</th>`).join('')}<th class="r">Brutto</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${r.label}</td><td class="r num">${r.n}</td><td class="r num">${dec(r.net)}</td>${d.rates.map(k=>`<td class="r num">${dec(r.tx[k])}</td>`).join('')}<td class="r num">${dec(r.total)}</td></tr>`).join('')}</tbody>
   <tfoot><tr><td>Total ${d.y}</td><td class="r num">${d.tot.n}</td><td class="r num">${dec(d.tot.net)}</td>${d.rates.map(k=>`<td class="r num">${dec(d.tot.tx[k])}</td>`).join('')}<td class="r num">${dec(d.tot.total)}</td></tr></tfoot></table></div>

   <div class="panel"><h3>Steuerfälle</h3><div class="list"><div class="li"><div class="g"><b>Standard</b><small>Steuer nach hinterlegten Sätzen</small></div></div><div class="li"><div class="g"><b>Reverse Charge</b><small>nur DE und AT, setzt unternehmerischen Kunden mit UID/USt-IdNr. voraus</small></div></div><div class="li"><div class="g"><b>Steuerfreie Leistung</b><small>nur mit Steuerhinweis und Rechtsgrundlage</small></div></div></div><p class="muted" style="font-size:12.5px;margin-top:8px">Eine ausländische Kundenadresse allein löst nie eine Steuerbefreiung aus.</p></div>

function pdfModal(inv){openModal(`${MH('PDF-Vorschau',esc(pdfName(inv)))}<div class="notice">${ico('alert')}<span>Das ist die Layout-Vorschau. Die serverseitige PDF-Erzeugung mit Speicherung und signierter Download-URL gehört zur Produktionsversion und ist in dieser Demo nicht aktiv. Ein Download findet deshalb nicht statt.</span></div><div class="paperframe">${paper(inv,inv.template)}</div><div class="mf"><button class="btn" data-act="closemodal">Schliessen</button></div>`,true)}
function mailModal(inv,subject,body,kind){
  const cu=cust(inv.cust),c=calc(inv),set=S.settings,isQ=inv.kind==='quote';kind=kind||(isQ?'Angebot':'Rechnung');
  subject=subject||`${kind} ${inv.no} – ${set.company}`;
  body=body||`Guten Tag ${cu.contact||cu.name},\n\n${isQ?'anbei erhalten Sie unser Angebot für die geplanten Leistungen.':set.mailBody}\n\n${isQ?'Angebotssumme':'Rechnungsbetrag'}: ${cm(c.total,inv)}\n${isQ?'Gültig bis':'Zahlbar bis'}: ${fd(inv.due)}\n\nVielen Dank für die Zusammenarbeit.\n\nFreundliche Grüsse\n${set.company}`;
  openModal(`${MH(kind+' versenden',esc(inv.no))}<div class="stack"><div class="notice bad">${ico('alert')}<span>E-Mail-Dienst nicht konfiguriert: <span class="mono">RESEND_API_KEY</span> fehlt. Es kann nichts versendet werden. Du kannst den Text prüfen und kopieren.</span></div>
   <div class="field"><label for="ml-to">Empfänger</label><input id="ml-to" class="in" type="email" value="${esc(cu.email)}"></div><div class="field"><label for="ml-sub">Betreff</label><input id="ml-sub" class="in" value="${esc(subject)}"></div>
   <div class="field"><label for="ml-body">Nachricht</label><textarea id="ml-body" class="in" style="min-height:220px">${esc(body)}</textarea></div>
   <div class="muted" style="font-size:13px">Anhang: ${esc(pdfName(inv))} (PDF-Datei zum Herunterladen in der Demo, der Versand ist simuliert)</div><div id="ml-res"></div></div>
   <div class="mf"><button class="btn" data-act="closemodal">Schliessen</button><button class="btn" data-act="ml-copy">${ico('copy')}Text kopieren</button><button class="btn primary" data-act="ml-send">${ico('send')}Versenden</button></div>`)}
function confirmModal(title,text,act,id,label,danger){openModal(`${MH(title)}<p>${text}</p><div class="mf"><button class="btn" data-act="closemodal">Abbrechen</button><button class="btn ${danger?'danger':'primary'}" data-act="${act}" data-id="${id||''}">${label}</button></div>`)}

function bankParse(text,cur){const O=openInvs(cur);
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=l.includes('\t')?l.split('\t'):l.split(';');if(p.length<3)return null;
    const ds=p[0].trim(),m=ds.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/),date=m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:(/^\d{4}-\d{2}-\d{2}$/.test(ds)?ds:null);
    const raw=p[p.length-1].trim();if(date===null&&!/^-?[\d.,']+$/.test(raw))return null;
    const amt=pd(raw,2),text=p.slice(1,-1).join(' ').trim();if(!date&&!amt)return null;
    const r={date:date||todayIso,text,amt,out:amt<=0};if(r.out){r.conf='Ausgang';return r}
    const up=text.toUpperCase(),byNo=O.find(i=>i.no&&up.includes(i.no.toUpperCase()));
    if(byNo){r.m=byNo;const rest=calc(byNo).rest;r.conf=amt===rest?'Sicher (Nummer und Betrag)':amt<rest?'Teilzahlung vermutet':'Betrag höher als offen, bitte prüfen'}
    else{const same=O.filter(i=>calc(i).rest===amt);if(same.length===1){r.m=same[0];r.conf='Wahrscheinlich (nur Betrag)'}else r.conf=same.length>1?'Mehrdeutig: mehrere Rechnungen mit diesem Betrag':'Kein Treffer'}
    return r}).filter(Boolean)}

function gsItems(q){q=q.toLowerCase().trim();const out=[];
  const cmds=[['cmd:newinv','Neue Rechnung','n'],['cmd:newquote','Neues Angebot',''],['cmd:newcust','Neuer Kunde',''],['nav:auto','Automatisierung',''],['nav:tax','Steuern & Auswertungen',''],['nav:payments','Zahlungen','']];
  if(!q)return cmds.map(c=>({k:c[0],t:c[1],s:c[2]?'Taste '+c[2]:'Aktion'}));
  cmds.filter(c=>c[1].toLowerCase().includes(q)).forEach(c=>out.push({k:c[0],t:c[1],s:'Aktion'}));
  S.invoices.filter(i=>[i.no,i.project,i.ref,cust(i.cust).name].join(' ').toLowerCase().includes(q)).slice(0,6).forEach(i=>out.push({k:'doc:'+i.id,t:(i.no||'Entwurf')+' · '+cust(i.cust).name,s:'Rechnung · '+SL[stat(i)]+' · '+cm(calc(i).total,i)}));
  S.quotes.filter(i=>[i.no,i.project,cust(i.cust).name].join(' ').toLowerCase().includes(q)).slice(0,4).forEach(i=>out.push({k:'doc:'+i.id,t:i.no+' · '+cust(i.cust).name,s:'Angebot'}));
  S.customers.filter(c=>[c.name,c.contact,c.city,c.email].join(' ').toLowerCase().includes(q)).slice(0,5).forEach(c=>out.push({k:'cust:'+c.id,t:c.name,s:'Kunde · '+c.city+' · '+(c.cur||CUR())}));
  return out}

function planBanner(){
  if(['plan','editor','legal'].includes(UI.view))return '';
  const L=custLimit();if(L>=BIG)return '';
  const u=activeCust().length,pct=Math.min(100,Math.round(u/L*100)),st=u>L?'bad':u>=L?'bad':u>=L-1?'warn':'';
  const msg=u>L?`${u} aktive Kunden, über dem Limit von ${L}. Bestehende Kunden bleiben nutzbar, neue brauchen einen Tarif.`:u>=L?`Limit erreicht. Für weitere Kunden brauchst du einen Tarif.`:u>=L-1?`Fast voll. Noch ${L-u} Kunde im Tarif ${PL[plan()].name}.`:`Tarif ${PL[plan()].name}: ${u} von ${L} Kunden`;
  return `<div class="planbar ${st}"><div class="pt"><b>${msg}</b><div class="pbar"><i style="width:${pct}%"></i></div></div><button class="btn sm ${st?'primary':''}" data-act="nav" data-id="plan">${st?'Tarif wählen':'Tarife ansehen'}</button></div>`}

const LD={
 imprint:{t:'Impressum',s:[
  ['Anbieterin',[`<b>${OP.name}</b><br>${OP.street}<br>${OP.zip} ${OP.city}<br>${OP.country}`,'Telefon: '+OP.phone,'E-Mail: '+OP.email]],

  ['Produkt','Zahlvio ist eine Software zur Erstellung und Verwaltung von Rechnungen für Unternehmen. Betrieben wird sie von der oben genannten Anbieterin.'],
  ['Hinweis zur Demo','Die zugängliche Demo-Version enthält ausschliesslich Beispieldaten. Sie stellt keine Rechnungen aus und ersetzt keine Steuer- oder Rechtsberatung.']]},
 terms:{t:'AGB für Unternehmen',s:[
  ['1. Geltungsbereich','Diese Bedingungen gelten für die Nutzung von Zahlvio durch Unternehmen und selbständig Erwerbstätige (B2B). Verbraucher sind vom Angebot ausgeschlossen. Mit der Registrierung bestätigt der Kunde, dass er als Unternehmer handelt. Anbieterin ist die '+OP.name+', '+OP.street+', '+OP.zip+' '+OP.city+', Liechtenstein (nachfolgend «wir»).'],
  ['2. Unsere Leistung','Wir stellen Zahlvio als Online-Dienst (Software as a Service) bereit. Der Kunde kann damit Rechnungen, Angebote, Zahlungserinnerungen und Auswertungen erstellen und verwalten. Wir sind Anbieterin des Werkzeugs. Wir sind nicht Partei der Geschäfte zwischen dem Kunden und seinen eigenen Kunden. Wir erbringen keine Steuer-, Rechts-, Buchhaltungs- oder Treuhandberatung.'],
  ['3. Verantwortung des Kunden','Der Kunde ist allein verantwortlich für Inhalt und Richtigkeit seiner Rechnungen und Dokumente, insbesondere für Beträge, Steuersätze, Steuerfall, Steuerhinweise, Umsatzsteuer- bzw. UID-Nummern, Fristen und Empfänger. Voreinstellungen, Vorschläge, Hinweise und Berechnungshilfen von Zahlvio sind unverbindliche Hilfen. Der Kunde prüft jede Rechnung vor dem Finalisieren und lässt sich bei Zweifeln fachlich beraten. Gesetzliche Pflichten zu Rechnungsinhalt, Buchführung, Aufbewahrung und Meldungen gegenüber Behörden liegen beim Kunden. Der Kunde sorgt für die Aufbewahrung nach den für ihn geltenden Fristen und nutzt dafür die Exportfunktion.'],
  ['4. Tarife, Kundenlimit und Preise','Der Gratis-Tarif umfasst bis zu 5 aktive Kunden. Archivierte Kunden zählen nicht. Für mehr aktive Kunden oder weitere Funktionen ist ein kostenpflichtiger Tarif zu wählen. Preise verstehen sich in der angegebenen Währung zuzüglich gesetzlicher MWST bzw. USt. Die Abrechnung erfolgt im Voraus, monatlich oder jährlich. Preisänderungen kündigen wir mindestens 30 Tage vorher an. Bei Überschreitung des Limits sperren wir nur das Anlegen neuer Kunden. Der Zugriff auf bestehende Daten bleibt erhalten.'],
  ['5. Zahlung und Verzug','Bei Zahlungsverzug können wir nach Mahnung und angemessener Nachfrist auf den Gratis-Tarif zurückstufen. Der Zugriff auf Daten und Export bleibt bestehen.'],
  ['6. Verfügbarkeit und Support','Wir bemühen uns um eine hohe Verfügbarkeit, schulden aber keine bestimmte Verfügbarkeit, soweit nichts anderes schriftlich vereinbart ist. Wartungsarbeiten kündigen wir nach Möglichkeit vorher an. [Supportzeiten und Reaktionszeiten ergänzen]'],
  ['7. Datenschutz','Soweit wir im Auftrag des Kunden personenbezogene Daten seiner Kunden verarbeiten, gilt der Auftragsverarbeitungsvertrag (AVV) als Bestandteil dieser Bedingungen.'],
  ['8. Haftung','Wir haften unbeschränkt bei Vorsatz, grober Fahrlässigkeit und für Personenschäden sowie soweit das Gesetz zwingend eine Haftung vorsieht. Bei leichter Fahrlässigkeit haften wir nur bei Verletzung wesentlicher Vertragspflichten und begrenzt auf das Entgelt, das der Kunde in den letzten 12 Monaten vor dem schädigenden Ereignis bezahlt hat, mindestens aber [Betrag ergänzen]. Wir haften nicht für entgangenen Gewinn, indirekte Schäden und Folgeschäden sowie nicht für Steuernachforderungen, Zinsen, Bussen oder Schäden, die auf unrichtigen oder unvollständigen Angaben des Kunden oder auf unterlassener Prüfung beruhen. Für Datenverlust haften wir nicht, soweit der Kunde die Daten über die Exportfunktion hätte sichern können. Der Kunde stellt uns von Ansprüchen Dritter frei, die auf seinen Inhalten, Rechnungen oder einer rechtswidrigen Nutzung beruhen.'],
  ['9. Laufzeit und Kündigung','Der Gratis-Tarif kann jederzeit beendet werden. Kostenpflichtige Tarife laufen monatlich oder jährlich und sind zum Ende der Laufzeit kündbar, bei Jahresverträgen mit einer Frist von 30 Tagen. Nach Vertragsende stellen wir die Daten 30 Tage zum Export bereit und löschen sie danach, soweit keine gesetzliche Pflicht entgegensteht.'],
  ['10. Änderungen','Wir können diese Bedingungen mit einer Ankündigungsfrist von 30 Tagen ändern. Widerspricht der Kunde nicht, gelten sie als angenommen. Der Kunde kann in diesem Fall kündigen.'],
  ['11. Recht und Gerichtsstand','Es gilt liechtensteinisches Recht unter Ausschluss des Kollisionsrechts und des UN-Kaufrechts. Gerichtsstand ist Vaduz, soweit zulässig.'],
  ['12. Schlussbestimmungen','Änderungen und Ergänzungen bedürfen mindestens der Textform. Ist eine Bestimmung unwirksam, bleibt der Rest gültig.']]},
 avv:{t:'Auftragsverarbeitungsvertrag (AVV)',s:[
  ['1. Rollen und Gegenstand','Für die Daten, die der Kunde in Zahlvio über seine eigenen Kunden, Interessenten und Ansprechpartner erfasst, ist der Kunde <b>Verantwortlicher</b> und die '+OP.name+' <b>Auftragsverarbeiterin</b> im Sinne von Art. 28 DSGVO und des liechtensteinischen Datenschutzgesetzes. Für die Daten des Kunden selbst (Konto, Abrechnung) ist die '+OP.name+' selbst Verantwortliche, siehe Datenschutzerklärung.'],
  ['2. Art, Zweck, Daten, Betroffene','Zweck: Bereitstellung der Software zur Erstellung und Verwaltung von Rechnungen, Angeboten, Zahlungen und Mahnungen. Datenarten: Namen, Adressen, Kontaktdaten, Steuer- und Firmennummern, Rechnungs- und Zahlungsdaten, Notizen. Betroffene: Kunden, Interessenten, Ansprechpartner und Mitarbeitende des Kunden.'],
  ['3. Weisungen','Wir verarbeiten die Daten nur auf dokumentierte Weisung des Kunden. Die Nutzung der Software im Rahmen der AGB gilt als Weisung. Halten wir eine Weisung für rechtswidrig, weisen wir den Kunden darauf hin.'],
  ['4. Vertraulichkeit','Personen, die für uns Daten verarbeiten, sind zur Vertraulichkeit verpflichtet.'],
  ['5. Sicherheit','Wir treffen technische und organisatorische Massnahmen nach Art. 32 DSGVO. Die Massnahmen beschreibt die Seite «Sicherheit». Wir entwickeln sie weiter.'],
  ['6. Unterauftragsverarbeiter','Der Kunde stimmt dem Einsatz der Unterauftragsverarbeiter aus der veröffentlichten Liste allgemein zu. Wir informieren mindestens 30 Tage vor einer Änderung. Der Kunde kann aus wichtigem Grund widersprechen. Wir verpflichten Unterauftragsverarbeiter vertraglich auf ein gleichwertiges Schutzniveau.'],
  ['7. Rechte betroffener Personen','Wir unterstützen den Kunden mit geeigneten Mitteln bei der Beantwortung von Anfragen betroffener Personen, etwa durch Export-, Berichtigungs- und Löschfunktionen. Anfragen, die bei uns eingehen, leiten wir an den Kunden weiter.'],
  ['8. Datenschutzverletzungen','Wir melden dem Kunden eine Verletzung des Schutzes personenbezogener Daten unverzüglich nach Kenntnis und liefern die für die Meldung nötigen Informationen. Die Meldung an die Aufsichtsbehörde und an Betroffene ist Sache des Kunden.'],
  ['9. Unterstützungspflichten','Wir unterstützen den Kunden angemessen bei Datenschutz-Folgenabschätzungen und Konsultationen der Aufsichtsbehörde.'],
  ['10. Drittländer','Wir verarbeiten Daten im Europäischen Wirtschaftsraum oder in der Schweiz. Eine Übermittlung in andere Länder erfolgt nur mit geeigneten Garantien, etwa Standardvertragsklauseln. [Hosting-Standort verbindlich ergänzen]'],
  ['11. Kontrolle','Wir stellen dem Kunden die Informationen bereit, die er zum Nachweis der Pflichten braucht, und ermöglichen angemessene Überprüfungen mit Vorankündigung.'],
  ['12. Ende der Verarbeitung','Nach Vertragsende geben wir die Daten heraus (Export) und löschen sie nach 30 Tagen, soweit keine gesetzliche Aufbewahrungspflicht besteht. Löscht der Kunde sein Konto selbst, werden die Daten sofort und unwiderruflich gelöscht. Aus den Sicherungen verschwinden sie, sobald die betreffende Sicherung abläuft (derzeit nach 14 Tagen).'],
  ['13. Haftung','Für die Haftung gilt Ziffer 8 der AGB, soweit gesetzlich zulässig. Ansprüche betroffener Personen bleiben unberührt.']]},
 privacy:{t:'Datenschutzerklärung',s:[
  ['1. Verantwortliche',[OPLINE,'Telefon '+OP.phone,'Datenschutz-Kontakt: '+OP.email]],
  ['2. Geltendes Recht','Zahlvio richtet sich an Unternehmen in der Schweiz, in Deutschland und in Österreich. Wir verarbeiten Personendaten nach der Datenschutz-Grundverordnung (DSGVO), die in Liechtenstein als EWR-Staat sowie in Deutschland und Österreich gilt, und nach dem liechtensteinischen Datenschutzgesetz. Für Nutzer in der Schweiz berücksichtigen wir zusätzlich das schweizerische Datenschutzgesetz (DSG). Ergänzende nationale Vorschriften in Deutschland und Österreich beachten wir, soweit sie für uns gelten.'],
  ['3. Diese Demo','Die Demo speichert Eingaben ausschliesslich im Browser deines Geräts. Es werden keine Daten an uns übertragen und keine Tracker geladen. Die Schriftart Inter wird von Google Fonts geladen. Dabei erhält der Anbieter deine IP-Adresse. In der Produktion hosten wir die Schrift selbst.'],
  ['4. Produktion: Daten, Zwecke, Rechtsgrundlagen',['Kontodaten (Name, E-Mail, Firma, Land): Vertragserfüllung, Art. 6 Abs. 1 lit. b DSGVO','Abrechnungsdaten: Vertragserfüllung und gesetzliche Pflichten, lit. b und c','Nutzungs- und Sicherheitsdaten (Logs): berechtigtes Interesse an sicherem Betrieb, lit. f','Zugangsdaten: Vertragserfüllung und Sicherheit']],
  ['5. Kundendaten des Nutzers','Daten, die du über deine eigenen Kunden erfasst, verarbeiten wir in deinem Auftrag. Dafür gilt der Auftragsverarbeitungsvertrag. Du bist dafür Verantwortlicher und informierst deine Kunden selbst.'],
  ['6. Empfänger','Hosting, Zahlungsabwicklung, E-Mail-Versand und Fehlerüberwachung erfolgen über sorgfältig ausgewählte Dienstleister. Die aktuelle Liste siehst du unter «Unterauftragsverarbeiter».'],
  ['7. Speicherdauer','Konto- und Abrechnungsdaten bewahren wir so lange auf, wie der Vertrag läuft und gesetzliche Fristen es verlangen. Kundendaten löschen wir 30 Tage nach Vertragsende. Löschst du dein Konto selbst, löschen wir die Daten sofort. Aus den Sicherungen verschwinden gelöschte Daten, sobald die betreffende Sicherung abläuft (derzeit nach 14 Tagen). Anfragen über das Kontaktformular löschen wir, sobald sie erledigt sind und keine Aufbewahrungspflicht besteht.'],
  ['8. Cookies','Wir setzen nur technisch notwendige Speicher ein, etwa für die Anmeldung. Ein Einwilligungsbanner ist dafür nicht nötig. [Bei Einsatz von Analyse-Werkzeugen ergänzen]'],
  ['9. Deine Rechte','Du hast Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit und Widerspruch. Eine erteilte Einwilligung kannst du jederzeit mit Wirkung für die Zukunft widerrufen. Schreibe dazu an '+OP.email+'. Wir antworten in der Regel innert eines Monats. Beschwerden an Aufsichtsbehörden: siehe Ziffer 12.'],
  ['10. Datenübermittlung ausserhalb des EWR','Wir speichern Daten bei unserem Hosting-Anbieter in der Schweiz. Für die Schweiz hat die Europäische Kommission einen Angemessenheitsbeschluss erlassen, Daten aus dem EWR dürfen deshalb dorthin fliessen. Weitere Übermittlungen in Drittländer finden nicht statt. Setzen wir künftig Dienstleister ausserhalb von EWR und Schweiz ein, nutzen wir Standardvertragsklauseln oder andere zulässige Garantien und nennen den Dienstleister in der Liste der Unterauftragsverarbeiter.'],
  ['11. Sicherheit und Sicherungen','Wir schützen Daten durch technische und organisatorische Massnahmen, unter anderem verschlüsselte Übertragung, gehashte Passwörter, getrennte Konten und tägliche verschlüsselte Sicherungen. Einzelheiten stehen unter «Sicherheit». Bei einer Verletzung des Schutzes personenbezogener Daten informieren wir betroffene Kunden unverzüglich, damit sie ihre Meldepflichten erfüllen können, und melden selbst, wo das Gesetz es verlangt.'],
  ['12. Aufsichtsbehörden und Beschwerderecht','Du hast das Recht, dich bei einer Aufsichtsbehörde zu beschweren. Für uns zuständig ist die Datenschutzstelle des Fürstentums Liechtenstein. Du kannst dich auch an die Behörde an deinem Sitz oder Wohnort wenden: in Deutschland an die Datenschutzaufsicht deines Bundeslandes (für Unternehmen) oder den Bundesbeauftragten, in Österreich an die Datenschutzbehörde, in der Schweiz an den Eidgenössischen Datenschutz- und Öffentlichkeitsbeauftragten (EDÖB).'],
  ['13. Hinweise für Kunden in Deutschland und Österreich','Wenn du Zahlvio für deine Kunden in Deutschland oder Österreich nutzt, bist du Verantwortlicher im Sinne der DSGVO und wir handeln als Auftragsverarbeiterin nach Art. 28 DSGVO. Den Auftragsverarbeitungsvertrag schliesst du bei der Registrierung ab. Informationspflichten gegenüber deinen eigenen Kunden (Art. 13 und 14 DSGVO) und die Aufbewahrung deiner Belege nach dem für dich geltenden Recht (zum Beispiel Abgabenordnung in Deutschland, Bundesabgabenordnung in Österreich) liegen bei dir. Der Export in deinem Konto hilft dir dabei.'],
  ['14. Automatisierte Entscheidungen und Pflicht zur Angabe','Wir treffen keine ausschliesslich automatisierten Entscheidungen mit rechtlicher Wirkung für dich. Ohne die Angaben, die wir für Konto und Vertrag brauchen, können wir dir Zahlvio nicht bereitstellen.']]},
 liability:{t:'Verantwortung und Haftung',intro:'Klare Rollen schützen beide Seiten. Diese Übersicht fasst zusammen, wer wofür zuständig ist. Rechtlich massgeblich sind die AGB und der AVV.',
  rows:[['Inhalt der Rechnung (Beträge, Positionen, Texte)','Kunde','Du bestimmst, was auf der Rechnung steht.'],['Steuersatz, Steuerfall, Steuerhinweis, UID','Kunde','Zahlvio schlägt vor und warnt. Die Prüfung und die Entscheidung liegen bei dir.'],['Buchführung und Aufbewahrung','Kunde','Du bewahrst Belege nach den für dich geltenden Fristen auf. Der Export hilft dabei.'],['Versand an deine Kunden','Kunde','Du entscheidest, wer wann etwas erhält.'],['Datenschutz der Kundendaten','Kunde als Verantwortlicher, wir als Auftragsverarbeiterin','Siehe AVV.'],['Betrieb, Sicherheit, Sicherungen','Esche Consulting GmbH','Wir betreiben die Plattform mit angemessenen Massnahmen.'],['Korrekte Berechnung (Rundung, Summen)','Esche Consulting GmbH','Die Rechenlogik wird getestet. Fehler beheben wir.'],['Steuer- und Rechtsberatung','weder noch','Dafür ist eine Fachperson zuständig.']],
  s:[['Was wir nicht tun','Wir prüfen deine Rechnungen nicht inhaltlich, wir beraten nicht steuerlich und wir treten nicht als Vertragspartei gegenüber deinen Kunden auf.'],['Grenzen der Haftung','Haftungsbeschränkungen gelten nur im Rahmen des Gesetzes. Bei Vorsatz und grober Fahrlässigkeit haften wir unbeschränkt. Einzelheiten stehen in den AGB.']]},
 security:{t:'Sicherheit',intro:'Technische und organisatorische Massnahmen für den Livebetrieb. Es ist eine Beschreibung unserer Massnahmen, keine Zertifizierung. Was noch nicht umgesetzt ist, steht unter «In Planung».',
  s:[['Anmeldung und Zugriff',['Passwörter werden nie im Klartext gespeichert (bcrypt-Hash), Mindestlänge 12 Zeichen','Sperre nach mehreren Fehlversuchen, Begrenzung von Registrierungen, Passwort-Zurücksetzungen und Anfragen','Anmeldung über ein Sitzungs-Cookie (HttpOnly, nur für diese Website), Sitzungen laufen nach 14 Tagen ab, bei Passwortwechsel werden andere Geräte abgemeldet','Jedes Konto sieht ausschliesslich die eigenen Daten, jeder Zugriff wird gegen die Anmeldung geprüft']],
   ['Daten und Übertragung',['Verschlüsselte Übertragung (HTTPS mit HSTS), HTTP wird umgeleitet','Speicherung bei einem Hosting-Anbieter in der Schweiz, die Datenbank liegt ausserhalb des öffentlich erreichbaren Verzeichnisses','Schriften und Skripte kommen von unserem eigenen Server, es werden keine Dienste Dritter geladen','Der Versand von Rechnungen erfolgt nur für bestätigte Konten, mit Mengenbegrenzung']],
   ['Datensicherung',['Tägliche Sicherung der gesamten Datenbank, geprüft auf Integrität','Jede Sicherung wird mit AES-256-GCM verschlüsselt, der Schlüssel liegt nicht bei den Sicherungen','Aufbewahrung der letzten 14 Sicherungen, zusätzlich eine Kopie an einem zweiten Ort','Wiederherstellung wird mindestens vierteljährlich getestet, Ergebnis wird festgehalten','Gelöschte Daten verschwinden spätestens mit dem Ablauf der letzten Sicherung (14 Tage)']],
   ['Schutz der Anwendung',['Schutz gegen das Einschleusen von Skripten (strikte Inhaltsrichtlinie), gegen Einbettung in fremde Seiten und gegen gefälschte Anfragen','Finalisierte Rechnungen sind unveränderlich, Änderungen zeigen einen Konflikt statt still zu überschreiben','Eingaben werden serverseitig geprüft, Dateigrössen sind begrenzt']],
   ['Organisation',['Verpflichtung der Beteiligten zur Vertraulichkeit','Zugriff auf Kundendaten durch uns nur mit konkretem Anlass (zum Beispiel Supportanfrage des Kunden)','Bei einer Verletzung des Schutzes personenbezogener Daten informieren wir betroffene Kunden unverzüglich']],
   ['In Planung',['Zwei-Faktor-Anmeldung','Verschlüsselung der Daten im Ruhezustand auf Anwendungsebene zusätzlich zum Schutz des Hosters','Protokoll der Zugriffe durch den Betreiber','Unabhängige Sicherheitsprüfung durch Dritte']]]},

 subs:{t:'Unterauftragsverarbeiter',intro:'Vorgesehene Dienstleister. Diese Liste ist ein Platzhalter und wird vor dem Livegang verbindlich ausgefüllt.',

const FD=()=>UI.fd||(UI.fd={cust:8,team:1,feats:[]});
const FD_KEYS=['free','starter','pro','biz'];
function fdCalc(){const f=FD(),req=[];
 const rk=(lim)=>{for(const k of FD_KEYS){if(PL[k][lim]>=(lim==='cust'?f.cust:f.team))return PL[k].rank}return null};
 const rc=rk('cust'),rt=rk('team');
 req.push({rank:rc,why:f.cust<=PL.free.cust?`${f.cust} aktive Kunden passen in den Gratis-Tarif (bis ${PL.free.cust}).`:rc===1?`${f.cust} aktive Kunden sind mehr als die ${PL.free.cust} im Gratis-Tarif. Starter erlaubt bis ${PL.starter.cust}.`:`${f.cust} aktive Kunden sind mehr als die ${PL.starter.cust} im Starter. Ab Pro gibt es kein Kundenlimit.`});
 if(f.team>1)req.push({rank:rt==null?3:rt,why:rt==null?`${f.team} Personen sind mehr als die ${PL.biz.team} in Business. Dafür machen wir dir ein individuelles Angebot.`:`${f.team} Personen im Team brauchen mindestens ${PL[FD_KEYS[rt]].name} (bis ${PL[FD_KEYS[rt]].team} Personen).`});
 f.feats.forEach(x=>req.push({rank:PL[FEAT_MIN[x]].rank,why:`${FEAT_LABEL[x]} gibt es ab ${PL[FEAT_MIN[x]].name}.`}));
 const top=Math.max(...req.map(r=>r.rank)),key=FD_KEYS[top];
 const reasons=req.filter(r=>r.rank===top&&(top>0||r===req[0])).map(r=>r.why);
 return {key,top,reasons,over:rt==null&&f.team>1}}

function planFor(cust,team,feats){let r=0;
 for(const k of FD_KEYS){if(PL[k].cust>=cust){r=Math.max(r,PL[k].rank);break}}
 for(const k of FD_KEYS){if(PL[k].team>=team){r=Math.max(r,PL[k].rank);break}}
 feats.forEach(f=>{r=Math.max(r,PL[FEAT_MIN[f]].rank)});return FD_KEYS[r]}

 <div class="flow">${[['1','Anschauen','Probiere die Live-Demo aus oder buche ein kurzes Beratungsgespräch.'],['2','Einrichten','Firmendaten, Bankverbindung und erste Kunden eintragen. Fehlendes meldet Zahlvio.'],['3','Rechnung erstellen','Positionen eintragen, Vorschau prüfen und finalisieren.']].map(x=>`<div class="fstep"><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>

function advisoryHTML(){return `<section class="advisory" id="beratung"><div class="adv-l"><span class="tag">Persönlich beraten</span><h2>Sprich mit uns, bevor du dich entscheidest.</h2>

 <div class="adv-call"><div><small>Schnellster Weg, ohne Telefonkosten</small><strong>Per WhatsApp schreiben</strong></div><a class="btn wabtn" href="${waLink()}" target="_blank" rel="noopener">WhatsApp öffnen</a></div><p class="adv-tel">Auch telefonisch erreichbar: <b>${OP.phone}</b> <button type="button" class="linkbtn" data-act="copyphone">kopieren</button></p>
 <div class="adv-person"><span class="av">${ico('user')}</span><div><b>Deine Ansprechperson</b><span>Name und Foto werden vor dem Start ergänzt</span></div></div></div>
 <form class="adv-form" id="lm-form" novalidate><h3>Rückruf anfordern</h3><p class="muted" style="margin:0 0 4px;font-size:13.5px">Nur für Unternehmen. Im nächsten Schritt ergänzt du Details.</p>

const landBase=landing;
const LANDSET=['strip','nav','hero','fact','rows','preise','faq','final'];
function landParts(){const d=document.createElement('div');d.innerHTML=landBase();const w=d.firstElementChild,m={detail:[],tail:'',rest:[...d.children].slice(1).map(e=>e.outerHTML).join('')};let after=false;
 [...w.children].forEach(e=>{let k=e.id||'';
  if(!k){if(e.classList.contains('demo-strip'))k='strip';else if(e.tagName==='HEADER')k='nav';else if(e.classList.contains('sd-hero'))k='hero';else if(e.classList.contains('final'))k='final';
   else if(e.querySelector&&e.querySelector('#fakten'))k='fact';else k='x'}
  if(after){m.tail+=e.outerHTML;return}
  if(k==='final'){after=true;m.final=e.outerHTML;return}
  if(LANDSET.indexOf(k)>-1){m[k]=e.outerHTML;return}
  if(k==='beratung'||k==='anbieter')return;
  m.detail.push(e.outerHTML)});return m}

 return h}

function fxCalm(){if(reduced())return;const v=UI.view;if(v!=='landing'&&v!=='page')return;
 if('IntersectionObserver' in window){document.querySelectorAll('.stats b').forEach(b=>{if(b.dataset.n)return;b.dataset.n=b.textContent;const n=+b.textContent;if(!(n>0))return;b.textContent='0';
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){io.disconnect();const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}},{threshold:.6});io.observe(b)})}}
{const r6=render;render=function(k){r6(k);try{fxCalm()}catch(e){}}}

   case 'quotes':h=quotesView();break;case 'reminders':h=remindersView();break;case 'payments':h=paymentsView();break;
   case 'tax':h=taxView();break;case 'admin':h=adminView();break;case 'settings':h=settingsView();break;case 'auto':h=autoView();break;case 'plan':h=planView();break;case 'legal':h=legalView();break;case 'team':h=teamView();break;case 'editor':h=editorView();break;default:h=landing()}
  $('#root').innerHTML=h;if(keep)window.scrollTo(0,sy);
